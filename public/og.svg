<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>도형 피하기 — 타졸맨</title>
  <!--
    링크 공유용 썸네일 (1200x630).
    게임에 실제로 쓰는 색과 도형만 사용한다 —
    초록 미로벽(#385723) · 붉은 눈(#c00000) · 번개(#fff200) · 타졸맨과 빨간 판정점.
    글꼴은 NanumBarunGothic (NanumSquareRound 에는 '됌' 글리프가 없다).
    PNG 는 tools/make_thumbnail.mjs 로 이 파일에서 렌더한다.
  -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- 미로 벽 — 원작 p4 의 각진 초록 도형 -->
  <g fill="#385723">
    <polygon points="0,0 1200,0 1200,22 0,22"/>
    <polygon points="0,22 30,22 30,630 0,630"/>
    <polygon points="1170,22 1200,22 1200,630 1170,630"/>
    <polygon points="430,22 706,22 642,124 468,98"/>
    <polygon points="30,432 250,470 372,560 30,560"/>
    <polygon points="1170,300 1170,470 940,560 1090,392"/>
  </g>

  <!-- 붉은 눈 — 오른쪽 위 모서리에서 노려본다 (광선 없음) -->
  <g>
    <circle cx="1010" cy="150" r="168" fill="#c00000"/>
    <ellipse cx="962" cy="150" rx="31" ry="132" fill="#111111"/>
  </g>

  <!-- 번개 — 눈에서 아래로 내리꽂힌다 -->
  <polygon fill="#fff200" stroke="#c9a400" stroke-width="3"
    points="905,316 856,432 906,428 852,556 962,406 908,412 956,316"/>

  <!-- 타졸맨 — 도형을 피해 달리는 중 -->
  <g transform="translate(200 148) scale(3.9)" stroke="#000000" stroke-width="3.4" fill="none"
     stroke-linecap="round">
    <circle cx="0" cy="-16" r="8"/>
    <line x1="0" y1="-8" x2="0" y2="8"/>
    <line x1="-10" y1="-2" x2="10" y2="-2"/>
    <line x1="0" y1="8" x2="-9" y2="21"/>
    <line x1="0" y1="8" x2="9" y2="21"/>
  </g>
  <circle cx="200" cy="148" r="10" fill="#ff2d55"/>

  <!-- 제목 -->
  <g font-family="NanumBarunGothic, NanumGothic, sans-serif" text-anchor="start">
    <text x="72" y="340" font-size="126" font-weight="800" fill="#1a1a1a"
          stroke="#ffffff" stroke-width="16" paint-order="stroke">도형 피하기</text>
    <text x="78" y="416" font-size="38" font-weight="800" fill="#c00000"
          stroke="#ffffff" stroke-width="9" paint-order="stroke">도형을 피하면 됌 ㅋㅋㅋㅋㅋㅋㅋㅋ</text>
  </g>

  <!-- 아래 띠 -->
  <rect x="30" y="560" width="1140" height="70" fill="#385723"/>
  <g font-family="NanumBarunGothic, NanumGothic, sans-serif" fill="#ffffff" font-weight="800">
    <text x="72" y="605" font-size="33">캐릭터 타졸맨 · 제작자 임재경</text>
    <text x="1128" y="605" font-size="28" text-anchor="end" fill="#c8e6a0">마우스 · 터치 회피 게임</text>
  </g>
</svg>
